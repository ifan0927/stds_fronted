name: Frontend PR CI

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out frontend repository
        uses: actions/checkout@v6

      - name: Check out backend OpenAPI source
        uses: actions/checkout@v6
        with:
          repository: ifan0927/STDS_backend_go
          ref: dev
          path: stds_backend

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check generated OpenAPI types
        env:
          OPENAPI_SPEC_PATH: ${{ github.workspace }}/stds_backend/docs/spec/openapi.yaml
        run: npm run openapi:check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
